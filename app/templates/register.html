{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block content %}
<div class="auth-shell">
    <div class="auth-card">
        <h1>Create Account</h1>
        <form method="POST">
            <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
            <div class="field">
                <label for="username">Username</label>
                <input id="username" class="input" type="text" name="username" required>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" class="input" type="password" name="password" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%; margin-top:8px;">Register</button>
        </form>
        <p style="margin-top:14px; color:#9ec0d1;">
            Already have an account?
            <a href="{{ url_for('auth_bp.login') }}" style="color:#2ad4d9;">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
